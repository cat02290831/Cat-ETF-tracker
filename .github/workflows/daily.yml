name: Daily ETF Holdings Tracker

on:
  schedule:
    # 每天台灣時間 19:00 自動執行 (UTC時間 11:00)
    - cron: '0 11 * * *'
  workflow_dispatch: # 允許手動點按鈕執行

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas lxml html5lib

      - name: Run crawler
        run: python crawler.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update holdings $(date +'%Y-%m-%d')" && git push)
